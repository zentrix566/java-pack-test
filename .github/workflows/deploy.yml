name: Java Docker CI/CD to K3s (Dual Push to Aliyun)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  ALIYUN_REGISTRY: crpi-nfo20s3jyve6dt2s.cn-beijing.personal.cr.aliyuncs.com
  ALIYUN_REPO: zentrix-repo/java-pack-test
  IMAGE_NAME: zentrix566/java-pack-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REPO }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # 关键点：将 env 变量显式传递给 SSH 脚本
          envs: ALIYUN_REGISTRY,ALIYUN_REPO
          script: |
            # 1. 设置镜像全路径
            FULL_IMAGE_URL="${ALIYUN_REGISTRY}/${ALIYUN_REPO}:latest"
            echo "Deploying image: $FULL_IMAGE_URL"

            # 2. 更新镜像 (请确认你的 container 名字确实是 java-app)
            # 如果不确定名字，可以用 kubectl get deploy java-pack-test -o jsonpath='{.spec.template.spec.containers[0].name}' 查看
            kubectl set image deployment/java-pack-test java-app=$FULL_IMAGE_URL
            
            # 3. 强制重启（确保触发拉取最新的 latest）
            kubectl rollout restart deployment java-pack-test
            
            # 4. 检查状态
            kubectl rollout status deployment java-pack-test --timeout=180s