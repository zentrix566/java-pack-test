name: Java Docker CI/CD to K3s via SSH

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许手动触发

env:
  REGISTRY: ghcr.io
  # 镜像名建议手动写死为小写，避免 github.repository 包含大写字母导致推送失败
  IMAGE_NAME: zentrix566/java-pack-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 设置 Java 环境并打包
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. 登录 GHCR 镜像仓库
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 始终推送到 latest 标签
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 4. 通过 SSH 登录服务器并指挥 K3s
      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 这里的命令是在你的云服务器内部执行的
            
            # 1. 强制 K3s 重新拉取最新的 :latest 镜像并重启 Pod
            # 注意：请确保你在 K3s 中已经建立了名为 java-pack-test 的 Deployment
            kubectl rollout restart deployment java-pack-test
            
            # 2. 实时查看重启进度 (超时时间 3 分钟)
            kubectl rollout status deployment java-pack-test --timeout=180s