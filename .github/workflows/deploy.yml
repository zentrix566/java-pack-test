name: Docker CI/CD to GitHub Container Registry

on:
  push:
    branches: [ "main" ] # 只有 main 分支的提交会触发

env:
  # 设置 Docker 镜像名称，通常是 owner/repo-name
  IMAGE_NAME: ${{ github.repository }} # 会是你的用户名/JavaPackTest
  CONTAINER_REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 允许读取仓库内容
      packages: write # 允许写入 GitHub Packages (Container Registry)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests # 跳过测试，加快构建

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub Actions 提供的内置 token

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} # 使用 commit SHA 作为标签，方便回溯

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push # 确保在镜像构建并推送成功后才执行部署
    environment: production # 可选，用于环境管理和保护
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 登录 GHCR
            echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin
            
            # 拉取镜像
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # 停止并清理旧容器
            docker stop java-app || true
            docker rm java-app || true
            
            # 运行新容器
            docker run -d --name java-app -p 80:8080 ghcr.io/${{ github.repository }}:latest
          
            
