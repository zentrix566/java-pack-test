name: Docker CI/CD to GitHub Container Registry

on:
  push:
    branches: [ "main" ] # 监听 main 分支的推送

env:
  # 建议镜像名全部小写，避免 GHCR 兼容性问题
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 必须开启此权限才能推送到 GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # -DskipTests 能够加快构建速度
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 移除了会导致报错的行内注释
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-server:
    runs-on: ubuntu-latest
    needs: build-and-push # 只有构建成功后才执行部署
    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }} # 使用你配置的非 22 端口
          script: |
            # 1. 在服务器登录 GHCR (使用你的 PAT)
            echo ${{ secrets.GHCR_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # 2. 拉取最新镜像 (强制转换为小写，以防仓库名有大写)
            IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" | tr '[:upper:]' '[:lower:]')
            docker pull $IMAGE_LOWER

            # 3. 停止并删除旧容器 (使用 || true 防止因容器不存在而导致脚本中断)
            docker stop java-app || true
            docker rm java-app || true

            # 4. 启动新容器 (映射 80 端口到容器内 8080)
            docker run -d --name java-app -p 80:8080 $IMAGE_LOWER

            # 5. 清理虚悬镜像（释放磁盘空间）
            docker image prune -f