name: Docker CI/CD to K3s (Public Image)

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # 转换为全小写以防报错
  IMAGE_NAME: zentrix566/java-pack-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-to-k3s:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to K3s
        run: |
          # 动态修改 deployment.yml 中的镜像 tag 为本次构建的 SHA
          # 这样可以确保即使是 latest，K3s 也会因为 tag 变化而强制触发更新
          sed -i "s|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deployment.yml
          
          kubectl apply -f k8s/deployment.yml

      - name: Check Deployment Status
        run: |
          # 等待 K3s 完成镜像拉取和容器启动（超时设为 5 分钟，应对国内网络）
          kubectl rollout status deployment/java-pack-test --timeout=300s