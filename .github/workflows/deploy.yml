name: Java Docker CI/CD to K3s (Dual Push to Aliyun)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  # 修改为你的新版个人实例域名
  ALIYUN_REGISTRY: crpi-nfo20s3jyve6dt2s.cn-beijing.personal.cr.aliyuncs.com
  # 这里只需写：命名空间/仓库名
  ALIYUN_REPO: zentrix-repo/java-pack-test
  IMAGE_NAME: zentrix566/java-pack-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 2. 登录两个仓库
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 3. 构建并同时推送（利用 Docker 标签特性）
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REPO }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. 更新 Kubernetes Deployment 的镜像地址为阿里云地址
            # 这样 k3s 就会去阿里云内网拉取，速度飞快
#            kubectl set image deployment/java-pack-test java-app=${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REPO }}:latest
            kubectl set image deployment/java-pack-test java-app=crpi-nfo20s3jyve6dt2s.cn-beijing.personal.cr.aliyuncs.com/zentrix-repo/java-pack-test:latest
            # 2. 强制重启并检查状态
            kubectl rollout restart deployment java-pack-test
            kubectl rollout status deployment java-pack-test --timeout=180s